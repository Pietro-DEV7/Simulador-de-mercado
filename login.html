<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Mini Sistema de Mercado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Acesso ao Cliente</h1>
  </header>

  <main class="container">
    <section class="card">
      <h2>Faça seu Login</h2>
      <p class="msg" style="margin-bottom: 20px;">Identifique-se para concluir o pagamento.</p>

      <label>E-mail:</label>
      <input type="email" id="email" placeholder="exemplo@email.com">

      <label>Senha:</label>
      <input type="password" id="senha" placeholder="Sua senha">

      <button class="btn azul" onclick="entrar()">Entrar</button>
      <button class="btn vermelho" onclick="voltar()">Voltar à Loja</button>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
